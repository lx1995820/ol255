[build]
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  pretty_urls = false

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8889
  framework = "#custom"
  autoLaunch = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/public.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
